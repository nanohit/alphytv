<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <title>Alphy TV — каталог фильмов и сериалов.</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
    #bootStatus{min-height:100svh;display:grid;place-items:center;color:#777;font-size:14px}
  </style>
</head>
<body>
  <div id="appRoot"><div id="bootStatus">Загрузка…</div></div>
  <script>
    (() => {
      "use strict";

      const revision = "__ALPHY_ASSET_REV__";
      const isRevision = /^[0-9a-f]{40}$/i.test(revision);
      const base = isRevision
        ? `https://cdn.jsdelivr.net/gh/nanohit/alphytv@${revision}`
        : "";
      const scripts = [
        "identity.js",
        "foryou.js",
        "catalog-cache.js",
        "shaka-smooth.js",
        "app.js",
        "catalog.js",
        "keypool.js",
      ];

      const localUrl = (path) => `/${String(path).replace(/^\/+/, "")}`;
      const assetUrl = (path) => base
        ? `${base}/${String(path).replace(/^\/+/, "")}`
        : localUrl(path);

      window.__ALPHY_ASSET_BASE__ = base;
      window.__alphyAssetUrl = assetUrl;

      async function fetchText(path) {
        const urls = base ? [assetUrl(path), localUrl(path)] : [localUrl(path)];
        let lastError = null;
        for (const url of urls) {
          const controller = typeof AbortController === "function" ? new AbortController() : null;
          const timer = controller ? setTimeout(() => controller.abort(), 8000) : null;
          try {
            const response = await fetch(url, {
              cache: url.startsWith(base) && base ? "force-cache" : "no-cache",
              credentials: "omit",
              mode: url.startsWith("http") ? "cors" : "same-origin",
              referrerPolicy: "no-referrer",
              signal: controller?.signal,
            });
            if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
            return { body: await response.text(), url };
          } catch (error) {
            lastError = error;
          } finally {
            if (timer) clearTimeout(timer);
          }
        }
        throw lastError || new Error(`${path}: загрузка не удалась`);
      }

      function showError(error) {
        console.error("Alphy bootstrap failed", error);
        document.getElementById("appRoot").innerHTML =
          '<div id="bootStatus">Не удалось загрузить сайт. Обновите страницу.</div>';
      }

      function runScript(source) {
        const script = document.createElement("script");
        script.textContent = `${source.body}\n//# sourceURL=${source.url}`;
        document.body.appendChild(script);
      }

      async function boot() {
        const scriptSourcesPromise = Promise.all(scripts.map(fetchText));
        const [styleSource, shellSource] = await Promise.all([
          fetchText("styles.css"),
          fetchText("app-shell.html"),
        ]);
        const style = document.createElement("style");
        style.textContent = styleSource.body;
        document.head.appendChild(style);
        document.getElementById("appRoot").innerHTML = shellSource.body;
        document.querySelectorAll("[data-alphy-asset]").forEach((element) => {
          element.src = assetUrl(element.dataset.alphyAsset);
        });
        const scriptSources = await scriptSourcesPromise;
        for (const source of scriptSources) runScript(source);
        document.documentElement.dataset.alphyReady = "true";
      }

      boot().catch(showError);
    })();
  </script>
</body>
</html>
