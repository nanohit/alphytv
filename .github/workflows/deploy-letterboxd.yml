name: Deploy Letterboxd shards

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-letterboxd
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project:
          - lcldjrphnkufymdhevyx
          - icmjgvlsyfqwyewvsuje
          - gzwynsvcydynqidwxjru
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      - name: Deploy cache-only batch contract
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy letterboxd --project-ref "${{ matrix.project }}" --no-verify-jwt
