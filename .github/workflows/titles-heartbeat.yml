# Insurance for the title indexer.
#
# Cloudflare's own cron did eventually start firing (every two minutes, on the
# minute) after initially not running at all, so this is no longer the primary
# tick — it just covers an outage. Half-hourly, and mostly it will find the
# Worker already busy and get a lease-denied reply, which is the intended
# outcome: the lease is what stops two tick sources doubling the rate at the
# source.
name: Titles indexer heartbeat

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: titles-heartbeat
  cancel-in-progress: false

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Poke the indexer, in case Cloudflare cron has stopped
        run: |
          END=$(( $(date +%s) + 240 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            OUT=$(curl -s -m 120 "https://alphy-titles.p-tikhonin.workers.dev/run" || echo '{"ok":false}')
            echo "$(date -u +%H:%M:%S) $OUT"
            # The Worker paces itself and holds a lease for the length of a
            # batch; polling faster than that just burns lease-denied replies.
            sleep 60
          done
