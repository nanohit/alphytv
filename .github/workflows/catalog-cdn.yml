name: Publish curated catalog CDN snapshot

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curated-catalog-cdn
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: catalog-cdn
          fetch-depth: 1

      - name: Fetch authoritative catalog snapshot
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          const url = "https://nvpuetq65dds3gtx.public.blob.vercel-storage.com/catalog/curated.json";
          const response = await fetch(`${url}?cdn-sync=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`catalog download failed: ${response.status}`);
          const catalog = await response.json();
          if (Number(catalog?.schema) !== 1 || !Number.isInteger(Number(catalog?.revision)) || !Array.isArray(catalog?.lists)) {
            throw new Error("catalog payload is invalid");
          }
          await writeFile("curated-fallback.json", `${JSON.stringify(catalog, null, 2)}\n`);
          console.log(`catalog revision ${catalog.revision}`);
          NODE

      - name: Publish changed snapshot
        id: publish
        shell: bash
        run: |
          if git diff --quiet -- curated-fallback.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CDN snapshot is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add curated-fallback.json
          git commit -m "Refresh jsDelivr catalog snapshot"
          git push origin HEAD:catalog-cdn
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Purge jsDelivr branch alias
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "https://purge.jsdelivr.net/gh/nanohit/alphytv@catalog-cdn/curated-fallback.json"
